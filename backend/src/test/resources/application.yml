spring:
  datasource:
    url: jdbc:h2:mem:photoshare;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

photoshare:
  frontend-origin: http://localhost:5173
  cors-allowed-origins: http://localhost:5173
  jwt:
    issuer: photoshare-test
    staff-secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    gallery-secret-base64: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
    staff-ttl-seconds: 900
    gallery-ttl-seconds: 900
  storage:
    driver: local
    local-root: target/test-storage
    max-file-size-bytes: 10485760
    max-request-size-bytes: 220200960
    max-files-per-upload: 20
    max-image-pixels: 40000000
  rate-limit:
    window-seconds: 300
    login-attempts: 1000
    login-ip-attempts: 1000
    pin-attempts: 1000
    pin-ip-attempts: 1000
    registration-attempts: 1000
    member-provision-attempts: 1000
